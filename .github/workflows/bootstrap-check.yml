name: Release-control code check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-self-test:
    name: Release-control code self-test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reject unexpected binary or symlink control files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess

          allowed_prefixes = (
              "README.md",
              "AGENTS.md",
              ".github/",
              "docs/",
              "release/",
              "scripts/",
              "ops/",
          )

          for line in subprocess.check_output(
              ["git", "ls-tree", "-r", "HEAD"], text=True
          ).splitlines():
              meta, path = line.split("\t", 1)
              mode, kind, _sha = meta.split()
              if mode != "100644" or kind != "blob":
                  raise SystemExit(f"non-regular control entry rejected: {line}")
              if not path.startswith(allowed_prefixes):
                  raise SystemExit(f"unexpected control path: {path}")
              data = pathlib.Path(path).read_bytes()
              if len(data) > 131072:
                  raise SystemExit(f"control file too large: {path}")
              if b"\x00" in data:
                  raise SystemExit(f"binary control file rejected: {path}")
              data.decode("utf-8")

          print("P1_RELEASE_CONTROL_TEXT_TREE_VALID")
          PY

      - name: Exercise Python release-control self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_guard.py --self-test
          python3 scripts/publish_preflight.py --self-test
          python3 scripts/ghcr_cleanup.py --self-test
          python3 -m py_compile \
            scripts/release_guard.py \
            scripts/publish_preflight.py \
            scripts/ghcr_cleanup.py

      - name: Exercise restricted VPS wrapper parser
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/p1-react-staging-deploy.sh
          bash ops/p1-react-staging-deploy.sh --self-test

      - name: Parse every workflow as YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
              value = YAML.safe_load(File.read(path), permitted_classes: [], aliases: false)
              raise "workflow is not a mapping: #{path}" unless value.is_a?(Hash)
              puts "YAML_OK #{path}"
            end
          '

      - name: Enforce workflow residue and runner policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          checkout = "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
          forbidden = (
              "actions/" + "cache@",
              "actions/" + "upload-artifact@",
              "actions/" + "download-artifact@",
              "self" + "-hosted",
              "docker system" + " prune",
              "docker image" + " prune -a",
              "docker volume" + " prune",
              "docker compose" + " down",
          )

          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text("utf-8")
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f"forbidden workflow token {token!r} in {path}")
              for match in re.finditer(r"^\s*uses:\s*([^\s#]+)", text, re.MULTILINE):
                  value = match.group(1)
                  if value != checkout:
                      raise SystemExit(f"unapproved or unpinned Action {value!r} in {path}")

          publish = pathlib.Path(".github/workflows/publish-staging.yml").read_text("utf-8")
          cleanup = pathlib.Path(".github/workflows/ghcr-cleanup.yml").read_text("utf-8")

          expected_environment_counts = {
              "publish p1-source-build": (
                  publish.count("\n    environment: p1-source-build\n"),
                  1,
              ),
              "publish p1-vps-deploy": (
                  publish.count("\n    environment: p1-vps-deploy\n"),
                  2,
              ),
              "cleanup p1-vps-deploy": (
                  cleanup.count("\n    environment: p1-vps-deploy\n"),
                  1,
              ),
          }
          for label, (actual, expected) in expected_environment_counts.items():
              if actual != expected:
                  raise SystemExit(
                      f"unexpected environment reference count for {label}: "
                      f"expected {expected}, got {actual}"
                  )

          build_only_tokens = (
              "\n      source_sha:\n"
              '        description: "Exact current refs/heads/ai-dev SHA for build-only"\n'
              "        required: true\n"
              "        type: string\n",
              'DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}',
              '[[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]',
              '--bootstrap-source-sha "$BOOTSTRAP_SOURCE_SHA"',
              'candidate_tag": f"bootstrap-sha-',
          )
          combined = publish + "\n" + pathlib.Path(
              "scripts/publish_preflight.py"
          ).read_text("utf-8")
          for token in build_only_tokens:
              if token not in combined:
                  raise SystemExit(f"missing explicit build-only source contract: {token}")

          if "\n  schedule:\n" not in cleanup:
              raise SystemExit("GHCR cleanup must retain its scheduled trigger")

          wrapper = pathlib.Path("ops/p1-react-staging-deploy.sh").read_text("utf-8")
          if 'if [[ -z "$new_id" ]]; then' not in wrapper:
              raise SystemExit("missing empty portal ID restoration branch")
          if wrapper.count('restore_previous_portal_best_effort "$previous"') < 4:
              raise SystemExit("portal restoration is not applied to every failure branch")
          if 'fail "staging Nginx container changed during portal update"' in wrapper:
              raise SystemExit("Nginx drift must return to caller after portal restoration")

          print("P1_RELEASE_CONTROL_WORKFLOW_POLICY_VALID")
          PY
