name: Release-control code check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-self-test:
    name: Release-control code self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reject unexpected binary or symlink control files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess

          allowed_prefixes = (
              "README.md",
              "AGENTS.md",
              ".github/",
              "docs/",
              "release/",
              "scripts/",
              "ops/",
          )

          for line in subprocess.check_output(
              ["git", "ls-tree", "-r", "HEAD"], text=True
          ).splitlines():
              meta, path = line.split("\t", 1)
              mode, kind, _sha = meta.split()
              if mode != "100644" or kind != "blob":
                  raise SystemExit(f"non-regular control entry rejected: {line}")
              if not path.startswith(allowed_prefixes):
                  raise SystemExit(f"unexpected control path: {path}")
              data = pathlib.Path(path).read_bytes()
              if len(data) > 131072:
                  raise SystemExit(f"control file too large: {path}")
              if b"\x00" in data:
                  raise SystemExit(f"binary control file rejected: {path}")
              data.decode("utf-8")

          print("P1_RELEASE_CONTROL_TEXT_TREE_VALID")
          PY

      - name: Exercise trusted-base guard self-test
        run: python3 scripts/release_guard.py --self-test
