name: React staging asset smoke

on:
  push:
    branches:
      - maintenance/staging-asset-smoke
    paths:
      - ".github/workflows/staging-asset-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-react-staging-asset-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live production image URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live React staging markup and images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          STAGING = "https://staging.proizvodstvo1.ru"
          PRODUCTION = "https://proizvodstvo1.ru"
          HOME_URLS = [
              f"{PRODUCTION}/assets/img/photos/home-bg-landscape.avif",
              f"{PRODUCTION}/assets/img/photos/home-bg-landscape.webp",
              f"{PRODUCTION}/assets/img/photos/home-bg-landscape.png",
              f"{PRODUCTION}/assets/img/photos/home-bg-portrait.avif",
              f"{PRODUCTION}/assets/img/photos/home-bg-portrait.webp",
          ]
          DOC_URLS = [
              f"{PRODUCTION}/assets/img/photos/docs-legal/640w.avif",
              f"{PRODUCTION}/assets/img/photos/docs-legal/1024w.avif",
              f"{PRODUCTION}/assets/img/photos/docs-legal/1600w.avif",
              f"{PRODUCTION}/assets/img/photos/docs-legal/640w.webp",
              f"{PRODUCTION}/assets/img/photos/docs-legal/1024w.webp",
              f"{PRODUCTION}/assets/img/photos/docs-legal/1600w.webp",
          ]

          def fetch(url: str):
              request = urllib.request.Request(url, headers={"User-Agent": "p1-staging-asset-smoke/1"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.status, response.headers, response.read()

          last_error = "not started"
          for attempt in range(1, 13):
              try:
                  root_status, root_headers, root_body = fetch(f"{STAGING}/")
                  docs_status, _, docs_body = fetch(f"{STAGING}/docs/legal")
                  health_status, _, health_body = fetch(f"{STAGING}/health")
                  root = root_body.decode("utf-8")
                  docs = docs_body.decode("utf-8")
                  health = json.loads(health_body.decode("utf-8"))

                  assert root_status == 200
                  assert docs_status == 200
                  assert health_status == 200
                  assert health.get("status") == "ok"
                  assert health.get("seoIndexable") is False
                  assert "noindex, nofollow" in root_headers.get("X-Robots-Tag", "").lower()

                  for url in HOME_URLS:
                      assert url in root, f"homepage missing {url}"
                  assert '"/assets/img/photos/home-bg' not in root

                  for url in DOC_URLS:
                      assert url in docs, f"docs page missing {url}"
                  assert '"/assets/img/photos/docs-legal/' not in docs

                  for url in HOME_URLS + DOC_URLS:
                      status, headers, body = fetch(url)
                      content_type = headers.get_content_type()
                      assert status == 200, f"{url} returned {status}"
                      assert content_type.startswith("image/"), f"{url} returned {content_type}"
                      assert body, f"{url} returned an empty body"

                  print("P1_REACT_STAGING_PRODUCTION_ASSET_URLS_VALID")
                  print(f"HOME_URLS_OK={len(HOME_URLS)}")
                  print(f"DOC_URLS_OK={len(DOC_URLS)}")
                  print("RELATIVE_BROKEN_URLS_IN_MARKUP=false")
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = f"attempt {attempt}: {exc}"
                  print(last_error)
                  time.sleep(10)

          raise SystemExit(f"React staging production-asset smoke failed: {last_error}")
          PY
