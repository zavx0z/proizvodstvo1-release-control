name: React staging asset smoke

on:
  push:
    branches:
      - main
    paths:
      - "release/staging.json"
      - ".github/workflows/staging-asset-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-react-staging-asset-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live React staging image assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for deployed markup and image responses
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://staging.proizvodstvo1.ru"
          tmp="$(mktemp -d "$RUNNER_TEMP/p1-asset-smoke.XXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT

          fetch() {
            curl --silent --show-error --connect-timeout 10 --max-time 45 \
              --output "$2" --dump-header "$3" --write-out '%{http_code}' \
              "$base_url$1"
          }

          for attempt in $(seq 1 30); do
            rm -f -- "$tmp"/*
            root_status="$(fetch / "$tmp/root.body" "$tmp/root.headers" || true)"
            home_asset_status="$(fetch /assets/img/photos/home-bg-landscape.png "$tmp/home.body" "$tmp/home.headers" || true)"
            docs_status="$(fetch /docs/legal "$tmp/docs.body" "$tmp/docs.headers" || true)"
            docs_asset_status="$(fetch /assets/img/photos/docs-legal/1024w.webp "$tmp/docs-asset.body" "$tmp/docs-asset.headers" || true)"

            if [[ "$root_status" == 200 && "$home_asset_status" == 200 && "$docs_status" == 200 && "$docs_asset_status" == 200 ]] \
              && grep -Fq '/assets/img/photos/home-bg-landscape.png' "$tmp/root.body" \
              && ! grep -Eq 'home-bg-landscape\.(avif|webp)|home-bg-portrait' "$tmp/root.body" \
              && ! grep -Fq '/assets/img/og/cover.jpg' "$tmp/root.body" \
              && grep -Fq '/assets/img/photos/docs-legal/1024w.webp' "$tmp/docs.body" \
              && ! grep -Fq '1600w.avif' "$tmp/docs.body" \
              && grep -Eiq '^content-type:[[:space:]]*image/' "$tmp/home.headers" \
              && grep -Eiq '^content-type:[[:space:]]*image/' "$tmp/docs-asset.headers" \
              && grep -Fiq 'X-Robots-Tag: noindex, nofollow' "$tmp/root.headers"; then
              echo "P1_REACT_STAGING_ASSET_SMOKE_VALID"
              echo "HOME_ASSET_HTTP=$home_asset_status"
              echo "DOCS_ASSET_HTTP=$docs_asset_status"
              exit 0
            fi

            echo "asset smoke attempt $attempt not ready: root=$root_status home=$home_asset_status docs=$docs_status docs_asset=$docs_asset_status"
            sleep 10
          done

          echo "React staging asset smoke failed after 30 attempts" >&2
          echo "ROOT_HEADERS_SHA256=$(sha256sum "$tmp/root.headers" | awk '{print $1}')" >&2
          echo "ROOT_BODY_SHA256=$(sha256sum "$tmp/root.body" | awk '{print $1}')" >&2
          echo "HOME_HEADERS_SHA256=$(sha256sum "$tmp/home.headers" | awk '{print $1}')" >&2
          echo "DOCS_HEADERS_SHA256=$(sha256sum "$tmp/docs.headers" | awk '{print $1}')" >&2
          echo "DOCS_ASSET_HEADERS_SHA256=$(sha256sum "$tmp/docs-asset.headers" | awk '{print $1}')" >&2
          exit 1
