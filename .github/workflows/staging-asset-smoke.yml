name: React staging asset smoke

on:
  push:
    branches:
      - maintenance/staging-asset-smoke
    paths:
      - ".github/workflows/staging-asset-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-react-staging-asset-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Diagnose live image delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production and staging asset contracts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "$RUNNER_TEMP/p1-asset-diagnose.XXXXXX")"
          trap 'rm -rf -- "$tmp"' EXIT

          probe() {
            local label="$1" url="$2"
            local line
            line="$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 \
              --output /dev/null --write-out '%{http_code}|%{content_type}|%{url_effective}' "$url" || true)"
            printf '%s=%s\n' "$label" "$line"
          }

          curl --silent --show-error --location --connect-timeout 10 --max-time 45 \
            https://proizvodstvo1.ru/ > "$tmp/production.html"
          curl --silent --show-error --location --connect-timeout 10 --max-time 45 \
            https://staging.proizvodstvo1.ru/ > "$tmp/staging.html"
          curl --silent --show-error --location --connect-timeout 10 --max-time 45 \
            https://staging.proizvodstvo1.ru/health > "$tmp/health.json"

          echo 'PRODUCTION_HOME_REFERENCES_BEGIN'
          grep -Eo '/assets/[^\"]*(home-bg|cover)[^\"]*' "$tmp/production.html" | sort -u || true
          echo 'PRODUCTION_HOME_REFERENCES_END'

          echo 'STAGING_HOME_REFERENCES_BEGIN'
          grep -Eo '/assets/[^\"]*(home-bg|cover)[^\"]*' "$tmp/staging.html" | sort -u || true
          echo 'STAGING_HOME_REFERENCES_END'

          printf 'STAGING_HEALTH='
          cat "$tmp/health.json"
          echo

          probe PROD_HOME_AVIF https://proizvodstvo1.ru/assets/img/photos/home-bg-landscape.avif
          probe PROD_HOME_WEBP https://proizvodstvo1.ru/assets/img/photos/home-bg-landscape.webp
          probe PROD_HOME_PNG https://proizvodstvo1.ru/assets/img/photos/home-bg-landscape.png
          probe PROD_HOME_PORTRAIT_AVIF https://proizvodstvo1.ru/assets/img/photos/home-bg-portrait.avif
          probe PROD_DOCS_1600_AVIF https://proizvodstvo1.ru/assets/img/photos/docs-legal/1600w.avif
          probe PROD_DOCS_1024_WEBP https://proizvodstvo1.ru/assets/img/photos/docs-legal/1024w.webp
          probe STAGING_HOME_AVIF https://staging.proizvodstvo1.ru/assets/img/photos/home-bg-landscape.avif
          probe STAGING_HOME_WEBP https://staging.proizvodstvo1.ru/assets/img/photos/home-bg-landscape.webp
          probe STAGING_HOME_PNG https://staging.proizvodstvo1.ru/assets/img/photos/home-bg-landscape.png
          probe STAGING_DOCS_1600_AVIF https://staging.proizvodstvo1.ru/assets/img/photos/docs-legal/1600w.avif
          probe STAGING_DOCS_1024_WEBP https://staging.proizvodstvo1.ru/assets/img/photos/docs-legal/1024w.webp
